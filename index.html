<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMC 증시 컨센서스 대시보드 | 군인공제회 증권운용1팀</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="title-block">
        <h1>증시 컨센서스 대시보드</h1>
        <p class="subtitle">군인공제회 증권운용1팀 · 위탁운용사(AMC) 컨센서스</p>
      </div>
      <div class="header-actions">
        <button id="btn-template" class="btn btn-ghost" type="button">엑셀 양식 다운로드</button>
        <label for="file-input" class="btn btn-primary">엑셀 업로드</label>
        <input id="file-input" type="file" accept=".xlsx,.xls" hidden />
      </div>
    </div>
    <div class="source-bar">
      <span id="data-source" class="source-pill">샘플 데이터 표시 중</span>
      <span id="data-asof" class="source-meta"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="domestic-overview" role="tab">국내 통합</button>
    <button class="tab" data-tab="domestic-amc" role="tab">국내 운용사별</button>
    <button class="tab" data-tab="overseas-overview" role="tab">해외 통합</button>
    <button class="tab" data-tab="overseas-amc" role="tab">해외 운용사별</button>
  </nav>

  <main class="content">
    <section id="domestic-overview" class="view is-active"></section>
    <section id="domestic-amc" class="view"></section>
    <section id="overseas-overview" class="view"></section>
    <section id="overseas-amc" class="view"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="app-footer">
    <span>내부 검토용 Mock · 백엔드 없이 브라우저에서 엑셀을 파싱합니다.</span>
  </footer>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
