<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMC 증시 컨센서스 대시보드 | 군인공제회 증권운용1팀</title>
  <link rel="stylesheet" href="css/styles.css?v=20260721b" />
  <!-- 공통 상단 탭바 스타일: 증권운용본부 데일리 3개 사이트 공통(복붙), active 만 다름 -->
  <style>
    .site-nav{background:#16304f;display:flex;align-items:center;gap:2px;
      padding:0 14px;height:42px;overflow-x:auto;}
    .site-nav .site-nav-brand{color:#9fb4d0;font-size:12.5px;font-weight:700;
      margin-right:16px;white-space:nowrap;}
    .site-nav a{color:#b9c7da;font-size:13.5px;font-weight:600;padding:0 14px;
      line-height:42px;text-decoration:none;white-space:nowrap;}
    .site-nav a:hover{color:#fff;}
    .site-nav a.active{color:#fff;background:#1f3a5f;box-shadow:inset 0 -3px 0 #6fa8ff;}
  </style>
</head>
<body>
  <nav class="site-nav">
    <span class="site-nav-brand">증권운용본부 Daily</span>
    <a href="https://ks200-d-s.netlify.app/">K200 D-S</a>
    <a href="https://k-market-watch-1.netlify.app/">K-Market-Watch</a>
    <a href="https://amc-consensus.netlify.app/" class="active">AMC Consensus</a>
  </nav>
  <header class="app-header">
    <div class="header-inner">
      <div class="title-block">
        <h1>증시 컨센서스 대시보드</h1>
        <p class="subtitle">군인공제회 증권운용1팀 · 위탁운용사(AMC) 컨센서스</p>
      </div>
      <div class="header-actions">
        <div class="period-box">
          <label for="period-select">회차</label>
          <select id="period-select"><option>로딩 중…</option></select>
        </div>
        <a id="btn-template" class="btn btn-ghost" href="templates/AMC_컨센서스_양식.xlsx" download>엑셀 양식</a>
        <label for="file-input" class="btn btn-primary">엑셀 업로드</label>
        <input id="file-input" type="file" accept=".xlsx,.xls" multiple hidden />
        <button id="btn-chat" class="btn btn-accent" type="button">AI 챗봇</button>
        <button id="btn-logout" class="btn btn-ghost" type="button" hidden>로그아웃</button>
      </div>
    </div>
    <div class="source-bar">
      <span id="data-source" class="source-pill">로딩 중…</span>
      <span id="data-asof" class="source-meta"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="domestic-overview" role="tab">국내 통합</button>
    <button class="tab" data-tab="domestic-amc" role="tab">국내 운용사별</button>
    <button class="tab" data-tab="overseas-overview" role="tab">해외 통합</button>
    <button class="tab" data-tab="overseas-amc" role="tab">해외 운용사별</button>
    <button class="tab" data-tab="trend" role="tab">회차 추이</button>
    <button class="tab" data-tab="admin" role="tab">제출 관리</button>
  </nav>

  <main class="content">
    <section id="domestic-overview" class="view is-active"></section>
    <section id="domestic-amc" class="view"></section>
    <section id="overseas-overview" class="view"></section>
    <section id="overseas-amc" class="view"></section>
    <section id="trend" class="view"></section>
    <section id="admin" class="view"></section>
  </main>

  <!-- AI 챗봇 드로어 -->
  <aside id="chat-drawer" class="chat-drawer" aria-hidden="true">
    <div class="chat-head">
      <span>AI 챗봇 · 과거 데이터 검색</span>
      <button id="chat-close" class="chat-close" type="button" aria-label="닫기">×</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div id="chat-suggest" class="chat-suggest"></div>
    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" rows="2" placeholder="예: 2026 2Q에 삼성전자를 매수로 본 운용사는?"></textarea>
      <button type="submit" class="btn btn-primary">전송</button>
    </form>
  </aside>
  <div id="chat-backdrop" class="chat-backdrop" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="app-footer">
    <span>군인공제회 증권운용1팀 내부 도구 · 데이터 저장소(SQLite) 기반 누적 관리</span>
  </footer>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="js/sample-data.js?v=20260706b"></script>
  <script src="js/xlsx-parse.js?v=20260721"></script>
  <script src="js/app.js?v=20260721"></script>
</body>
</html>
