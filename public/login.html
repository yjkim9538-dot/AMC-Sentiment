<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 증시 컨센서스 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #1a2a4a 0%, #11203c 100%); color: #1f2733;
    }
    .card { background: #fff; width: 360px; max-width: 92vw; border-radius: 14px; padding: 30px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
    h1 { font-size: 18px; margin: 0 0 4px; color: #1a2a4a; }
    p.sub { margin: 0 0 22px; font-size: 13px; color: #5a6678; }
    label { font-size: 13px; font-weight: 600; color: #1a2a4a; }
    input { width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 14px;
      border: 1px solid #dbe5f3; border-radius: 8px; }
    button { width: 100%; margin-top: 16px; padding: 11px; font-size: 14px; font-weight: 700;
      color: #fff; background: #4f86f7; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #3a73e8; }
    .err { margin-top: 12px; font-size: 13px; color: #b3271e; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>증시 컨센서스 대시보드</h1>
    <p class="sub">군인공제회 증권운용1팀 · 접근 비밀번호를 입력하세요.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button type="submit">로그인</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.textContent = '';
      try {
        var r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value })
        });
        if (r.ok) { location.href = '/'; }
        else { var j = await r.json().catch(function(){return {};}); err.textContent = j.error || '로그인 실패'; }
      } catch (_) { err.textContent = '서버에 연결할 수 없습니다.'; }
    });
  </script>
</body>
</html>
